<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RentDirect · Homes in Yaba</title>

  <!-- Fonts: Bricolage Grotesque for headings, Inter for body (RentDirect type tokens) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="error.css" />
</head>
<body>
  <div class="app">
    <main class="screen">

      <!-- Header -->
      <header class="app-header">
        <button class="back-btn" id="backBtn" aria-label="Go back">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="icon icon-arrow">
            <path d="M19 12H5" stroke="#26221C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 19L5 12L12 5" stroke="#26221C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <h1 class="app-title">Homes in Yaba</h1>
      </header>

      <!-- Error state -->
      <section class="error-state">
        <span class="error-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="icon icon-alert">
            <circle cx="12" cy="12" r="8.5" stroke="#A33B2E" stroke-width="1.6"/>
            <path d="M12 7.8V12.6" stroke="#A33B2E" stroke-width="1.6" stroke-linecap="round"/>
            <circle cx="12" cy="15.8" r="0.9" fill="#A33B2E"/>
          </svg>
        </span>

        <h2 class="error-title">Couldn&rsquo;t load listings</h2>
        <p class="error-desc">Check your internet connection, then try again. Your search is saved.</p>

        <button class="btn-primary" id="tryAgainBtn">
          <span class="btn-label">Try again</span>
        </button>
      </section>

    </main>
  </div>

  <script src="error.js"></script>
</body>
</html>
