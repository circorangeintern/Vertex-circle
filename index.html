<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>RentDirect</title>

  <link rel="stylesheet" href="welcome.css" />
</head>

<body>

  <main class="page">
    <header class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M10 21.5L24 10L38 21.5V38C38 39.1 37.1 40 36 40H12C10.9 40 10 39.1 10 38V21.5Z" fill="none"
            stroke="white" stroke-width="3" stroke-linejoin="round" />

          <path d="M19 40V27H29V40" fill="none" stroke="white" stroke-width="3" stroke-linejoin="round" />
        </svg>
      </div>

      <h1>RentDirect</h1>
    </header>

    <section class="hero">

      <h2>
        Find your next home.<br />

        <span class="highlight">No agent fee.</span>
        No extra<br class="desktop-break" />
        fee.
      </h2>

      <p class="hero-description">
        Talk to the landlord yourself. Every Verified
        home is checked by our team first.
      </p>

    </section>

    <section class="notice">

      <div class="notice-icon">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M24 5L38 10V22C38 31.5 32.1 39.3 24 43C15.9 39.3 10 31.5 10 22V10L24 5Z" fill="none"
            stroke="currentColor" stroke-width="2.8" stroke-linejoin="round" />

          <path d="M17 23.5L21.5 28L31 18.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </div>

      <p>
        Agents charge up to one extra month of
        rent. Here, you pay the landlord only.
      </p>

    </section>

    <section class="actions">

      <h3>What do you want to do?</h3>

      <a href="/home.html" class="button button-primary">
        Find a home
      </a>

      <a href="/ListStep1.html" class="button button-primary button-secondary">
        List your property
      </a>

      <a href="/howItWorks.html" class=" button button-primary how-it-works">
        How it works
      </a>

    </section>

  </main>

  <script src="./welcome.js"></script>
</body>

</html>
