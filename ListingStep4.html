<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentDirect - Step 4 of 5</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="ListingStep4.css">
</head>

<body>
    <div class="app-container">
        <!-- Header Section -->
        <header class="header-nav">
            <button class="back-btn" id="backBtn" aria-label="Go back">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="#26221C" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </button>
            <span class="step-indicator">Step 4 of 5</span>
        </header>

        <!-- Progress Bar Section -->
        <div class="progress-bar-container">
            <div class="progress-bar-fill"></div>
        </div>

        <!-- Main Content Area -->
        <main class="main-content">
            <section class="form-section">
                <h1 class="section-title">What is the location of your listing?</h1>

                <div class="input-group">
                    <input type="text" id="locationInput" class="text-input" placeholder="Tap to type..."
                        autocomplete="off">
                </div>

                <p class="input-hint">Select or type the location of your listing.</p>

                <div class="chips-grid">
                    <div class="chip selected" data-value="Yaba">Yaba</div>
                    <div class="chip" data-value="Surulere">Surulere</div>
                    <div class="chip" data-value="Lekki">Lekki</div>
                    <div class="chip" data-value="Ikeja">Ikeja</div>
                    <div class="chip" data-value="Ajah">Ajah</div>
                </div>
            </section>
        </main>

        <!-- Footer / Sticky CTA -->
        <footer class="footer-cta">
            <a href="./ListingStep5.html">
                <button class="primary-cta-btn" id="continueBtn">
                    Continue
                </button>
            </a>
        </footer>
    </div>

    <script src="ListingStep4.js"></script>
</body>

</html>
