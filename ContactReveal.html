<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RentDirect · Landlord contact</title>

  <!-- Fonts: Bricolage Grotesque for name/phone number, Inter for body (RentDirect type tokens) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="ContactReveal.css" />
</head>
<body>
  <div class="app">

    <!-- Dimmed listing photo behind the sheet -->
    <div class="backdrop" aria-hidden="true"></div>

    <!-- Contact bottom sheet -->
    <main class="sheet" id="contactSheet" role="dialog" aria-modal="true" aria-labelledby="landlordName">
      <div class="sheet-handle" aria-hidden="true"></div>

      <div class="sheet-content">

        <!-- Landlord identity -->
        <div class="landlord-row">
          <span class="avatar" aria-hidden="true">A</span>
          <span class="landlord-copy">
            <span class="landlord-name" id="landlordName">Mr. Adebayo O.</span>
            <span class="landlord-sub">Landlord &middot; Self&ndash;contained, Yaba</span>
          </span>
        </div>

        <!-- Phone / WhatsApp card -->
        <button class="phone-card" id="phoneCard" aria-label="Copy phone number">
          <span class="phone-label">Phone / WhatsApp</span>
          <span class="phone-number" id="phoneNumber">0803 456 7890</span>
          <span class="phone-hint" id="phoneHint">Tap and hold to copy</span>
        </button>

        <!-- Actions -->
        <div class="action-row">
          <button class="btn-call" id="callBtn">Call now</button>
          <button class="btn-whatsapp" id="whatsappBtn">WhatsApp</button>
        </div>

        <p class="footnote">Mention RentDirect when you call. Never pay before inspecting in person.</p>
      </div>
    </main>
  </div>

  <script src="ContactReveal.js"></script>
</body>
</html>
