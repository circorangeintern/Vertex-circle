<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RentDirect · Find a home</title>

  <!-- Fonts: Bricolage Grotesque for display/headings, Inter for body (RentDirect type tokens) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="home.css" />
</head>
<body>
  <div class="app">
    <main class="screen">

      <!-- Header -->
      <header class="app-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">R</span>
          <span class="brand-name">RentDirect</span>
        </div>
        <button class="btn-accent" id="listPropertyBtn">List your property</button>
      </header>

      <!-- Hero -->
      <section class="hero">
        <h1 class="hero-title">
          <span class="hero-line">Find your next home.</span>
          <span class="hero-line hero-accent">No agent fee.</span>
        </h1>
        <p class="hero-sub">Contact verified landlords directly. What you see is what you pay.</p>
      </section>

      <!-- Search -->
      <section class="search-row" style="display: flex; gap: 8px; align-items: center;">
  <!-- Your New Link Integration -->
  <a href="/search.html" style="text-decoration: none; color: #2D6A4F; font-weight: bold; font-size: 14px; white-space: nowrap;">
    View All →
  </a>

  <label style="display: flex; align-items: center; gap: 8px; border: 1px solid #8A8175; border-radius: 8px; padding: 6px 12px; flex: 1;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.5" stroke="#8A8175" stroke-width="1.8"/><path d="M20 20L15.8 15.8" stroke="#8A8175" stroke-width="1.8"/></svg>
    <input id="areaSearch" type="text" placeholder="Search area, e.g. Yaba" style="border:0; outline:0; width:100%;" autocomplete="off" />
  </label>

  <button id="filterBtn" aria-label="Open filters" style="background: #2D6A4F; border: 0; border-radius: 8px; padding: 8px; cursor: pointer; display: flex;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 7H20M4 12H20M4 17H20" stroke="#FFF" stroke-width="1.8"/><circle cx="9" cy="7" r="1.8" fill="#2D6A4F" stroke="#FFF"/><circle cx="16" cy="12" r="1.8" fill="#2D6A4F" stroke="#FFF"/><circle cx="10" cy="17" r="1.8" fill="#2D6A4F" stroke="#FFF"/></svg>
  </button>
</section>

<section id="chipRow" style="display: flex; gap: 6px; margin-top: 8px;">
  <style>.c{background:#F0EFEF; border:0; border-radius:15px; padding:6px 12px; font-size:12px; cursor:pointer}.s{background:#E8F5E9; color:#2D6A4F; border:1px solid #2D6A4F}</style>
  <button class="c s" data-chip="verified">Verified only</button>
  <button class="c" data-chip="price">Under ₦500k</button>
  <button class="c" data-chip="type">Self-contained</button>
</section>


      <p class="results-count" id="resultsCount">14 homes in Lagos</p>

      <!-- Listings -->
      <section class="listing-grid" id="listingGrid">

        <!-- Listing card (reusable structure) -->
        <article class="listing-card" tabindex="0">
          <div class="listing-media">
            <span class="badge badge-verified">
              <svg class="icon icon-shield" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 3.5L18.5 5.8V11C18.5 15.3 15.8 18.3 12 20.2C8.2 18.3 5.5 15.3 5.5 11V5.8L12 3.5Z" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
                <path d="M9.3 11.2L11.1 13L14.7 9.2" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>VERIFIED</span>
            </span>

            <span class="media-placeholder" aria-hidden="true">
              <svg class="icon icon-camera" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="6" width="16" height="13" rx="2" stroke="#B7AE9E" stroke-width="1.6"/>
                <circle cx="9" cy="10" r="1.1" fill="#B7AE9E"/>
                <path d="M5 17L9.5 12.8C10.1 12.2 11 12.2 11.6 12.8L14 15" stroke="#B7AE9E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M13 16L15.5 13.6C16.1 13 17 13 17.6 13.6L19 15" stroke="#B7AE9E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>

            <span class="badge badge-photos">5 photos</span>
          </div>

          <div class="listing-body">
            <p class="listing-price">₦450,000 / year</p>
            <p class="listing-type">Self-contained apartment</p>
            <p class="listing-meta">
              <svg class="icon icon-pin" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 21C12 21 18 15.6 18 10.5C18 6.9 15.3 4 12 4C8.7 4 6 6.9 6 10.5C6 15.6 12 21 12 21Z" stroke="#8A8175" stroke-width="1.6" stroke-linejoin="round"/>
                <circle cx="12" cy="10.3" r="2.1" stroke="#8A8175" stroke-width="1.6"/>
              </svg>
              <span>Yaba, Lagos &middot; Listed 2 days ago</span>
            </p>
          </div>
        </article>

        <!-- Second listing card (partially visible, same reusable structure) -->
        <article class="listing-card" tabindex="0">
          <div class="listing-media">
            <span class="badge badge-verified">
              <svg class="icon icon-shield" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 3.5L18.5 5.8V11C18.5 15.3 15.8 18.3 12 20.2C8.2 18.3 5.5 15.3 5.5 11V5.8L12 3.5Z" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
                <path d="M9.3 11.2L11.1 13L14.7 9.2" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span>VERIFIED</span>
            </span>
            <span class="media-placeholder" aria-hidden="true">
              <svg class="icon icon-camera" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="6" width="16" height="13" rx="2" stroke="#B7AE9E" stroke-width="1.6"/>
                <circle cx="9" cy="10" r="1.1" fill="#B7AE9E"/>
                <path d="M5 17L9.5 12.8C10.1 12.2 11 12.2 11.6 12.8L14 15" stroke="#B7AE9E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M13 16L15.5 13.6C16.1 13 17 13 17.6 13.6L19 15" stroke="#B7AE9E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </div>
          <div class="listing-body">
            <p class="listing-price">&nbsp;</p>
            <p class="listing-type">&nbsp;</p>
          </div>
        </article>

      </section>
    </main>

    <!-- Bottom navigation -->
    <footer class="app-footer">
      <nav class="bottom-nav" aria-label="Primary">
        <a href="/home.html" style="text-decoration: none;">
        <button class="nav-item is-active" data-nav="home">
          <svg class="icon icon-home" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 11.5L12 4.5L20 11.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M6 10V19C6 19.55 6.45 20 7 20H17C17.55 20 18 19.55 18 19V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10 20V15H14V20" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
          <span>Find a home</span>
        </button>
        </a>

        <a href="./ListStep1.html" style="text-decoration: none;">
        <button class="nav-item" data-nav="list">
          <svg class="icon icon-plus" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 5V19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M5 12H19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <span>List property</span>
        </button>
        </a>
        
        <a href="/howItWorks.html" style="text-decoration: none;">
        <button class="nav-item" data-nav="how">
          <svg class="icon icon-help" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M9.7 9.3C9.9 8.1 10.9 7.3 12.1 7.4C13.3 7.5 14.2 8.5 14 9.7C13.85 10.7 13 11.1 12.4 11.6C11.9 12 11.6 12.4 11.6 13.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="11.7" cy="15.6" r="0.9" fill="currentColor"/>
          </svg>
          <span>How it works</span>
        </button>
        </a>
      </nav>
    </footer>
  </div>

  <script src="home.js"></script>
</body>
</html>
