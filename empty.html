<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RentDirect · Homes in Ajah</title>

  <!-- Fonts: Bricolage Grotesque for headings, Inter for body (RentDirect type tokens) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="empty.css" />
</head>
<body>
  <div class="app">
    <main class="screen">

      <!-- Header -->
      <header class="app-header">
        <button class="back-btn" id="backBtn" aria-label="Go back">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="icon icon-arrow">
            <path d="M19 12H5" stroke="#26221C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 19L5 12L12 5" stroke="#26221C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <h1 class="app-title">Homes in Ajah</h1>
      </header>

      <!-- Empty state -->
      <section class="empty-state">
        <span class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="icon icon-home">
            <path d="M4.5 11.5L12 4.8L19.5 11.5" stroke="#8A8175" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M6.3 10V18C6.3 18.55 6.75 19 7.3 19H16.7C17.25 19 17.7 18.55 17.7 18V10" stroke="#8A8175" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10.3 19V14.3H13.7V19" stroke="#8A8175" stroke-width="1.7" stroke-linejoin="round"/>
          </svg>
        </span>

        <h2 class="empty-title">No homes in Ajah yet</h2>
        <p class="empty-desc">New homes are added every week. Try a nearby area or a different price.</p>

        <button class="btn-outline" id="searchNearbyBtn">Search Lekki instead</button>

        <button class="btn-text" id="changeFiltersBtn">Change filters</button>
      </section>

    </main>
  </div>

  <script src="empty.js"></script>
</body>
</html>
