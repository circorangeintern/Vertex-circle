<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RentDirect — Step 3 of 5</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="ListingStep3.css" />
</head>

<body>
  <!-- Mobile shell: centered on larger screens -->
  <div class="phone">
    <main class="screen">

      <!-- ============ Header: back + step counter ============ -->
      <header class="screen__header">
        <button class="icon-btn" type="button" id="backBtn" aria-label="Go back">
          <!-- Back arrow -->
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5" />
            <path d="M11 18l-6-6 6-6" />
          </svg>
        </button>
        <h2 class="screen__step">Step 3 of 5</h2>
      </header>

      <!-- ============ Summary card + progress ============ -->
      <section class="summary" aria-label="Listing progress">
        <div class="summary__card">
          <div class="summary__row">
            <div class="summary__text">
              <span class="summary__label">Rent per year</span>
              <span class="summary__value">&#8358;350,000</span>
            </div>
            <button class="summary__edit" type="button">Edit</button>
          </div>
        </div>

        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="5" aria-valuenow="3"
          aria-label="Step 3 of 5">
          <div class="progress__fill" id="progressFill"></div>
        </div>
      </section>

      <!-- ============ Question + input ============ -->
      <section class="form" aria-labelledby="rentQuestion">
        <h1 class="form__title" id="rentQuestion">How much is the rent per year?</h1>

        <div class="field" id="rentField">
          <span class="field__prefix" aria-hidden="true">&#8358;</span>
          <input class="field__input" id="rentInput" type="text" inputmode="numeric" autocomplete="off" value="350,000"
            aria-label="Rent per year in naira" />
        </div>

        <p class="form__hint">
          Enter the yearly rent only — tenants see exactly this number. No fees are added.
        </p>

        <!-- Quick-pick chips -->
        <div class="chips" role="group" aria-label="Suggested rent amounts">
          <button class="chip" type="button" data-amount="250000">&#8358;250k</button>
          <button class="chip" type="button" data-amount="350000">&#8358;350k</button>
          <button class="chip" type="button" data-amount="500000">&#8358;500k</button>
          <button class="chip" type="button" data-amount="1000000">&#8358;1m</button>
        </div>
      </section>

      <!-- ============ Footer CTA ============ -->
      <footer class="screen__footer">
        <a href="./ListingStep4.html">
          <button class="btn btn--primary" type="button" id="continueBtn">Continue</button>
        </a>
      </footer>

    </main>
  </div>

  <script src="ListingStep3.js"></script>
</body>

</html>
