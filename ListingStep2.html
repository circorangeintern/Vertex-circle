<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RentDirect · List property · Step 2 of 5</title>

  <!-- Fonts: Bricolage Grotesque for headings, Inter for body (RentDirect type tokens) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="ListingStep2.css" />
</head>

<body>
  <div class="app">
    <main class="screen">

      <!-- Header -->
      <header class="app-header">
        <button class="back-btn" id="backBtn" aria-label="Go back">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="icon icon-arrow">
            <path d="M19 12H5" stroke="#26221C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M12 19L5 12L12 5" stroke="#26221C" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </button>
        <h1 class="app-title">Step 2 of 5</h1>
      </header>

      <!-- Progress bar -->
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="5" aria-valuenow="2"
        aria-label="Listing step progress">
        <div class="progress-fill" id="progressFill" style="width: 40%;"></div>
      </div>

      <!-- Section intro -->
      <section class="section-intro">
        <h2 class="section-title">Add photos of your property</h2>
        <p class="section-desc">At least 3 clear photos. Listings with real photos get verified faster.</p>
      </section>

      <!-- Photo grid -->
      <section class="photo-grid" id="photoGrid">

        <!-- Add-photo tile (always first, reusable trigger) -->
        <button class="photo-tile photo-tile-add" id="addPhotoTile" type="button">
          <svg class="icon icon-plus" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 5V19" stroke="#2D6A4F" stroke-width="2" stroke-linecap="round" />
            <path d="M5 12H19" stroke="#2D6A4F" stroke-width="2" stroke-linecap="round" />
          </svg>
          <span class="add-photo-label">Add photo</span>
        </button>

        <!-- User-added photo tiles are inserted here by ListingStep2.js -->
      </section>

      <p class="photo-count" id="photoCount">0 of 3 minimum added</p>

      <!-- Hidden native file input, triggered by the "Add photo" tile -->
      <input type="file" id="fileInput" accept="image/*" multiple hidden />
    </main>

    <!-- Sticky continue button -->
    <div class="continue-bar">
      <a href="./ListingStep3.html">
        <button class="btn-primary" id="continueBtn">
          <span class="btn-label">Continue</span>
        </button>
      </a>
    </div>
  </div>


  <script src="ListingStep2.js"></script>
</body>

</html>
