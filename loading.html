<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RentDirect · Homes in Yaba</title>

  <!-- Fonts: Bricolage Grotesque for headings, Inter for body (RentDirect type tokens) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="loading.css" />
</head>
<body>
  <div class="app">
    <main class="screen">

      <!-- Header -->
      <header class="app-header">
        <button class="back-btn" id="backBtn" aria-label="Go back">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="icon icon-arrow">
            <path d="M19 12H5" stroke="#26221C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 19L5 12L12 5" stroke="#26221C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <h1 class="app-title">Homes in Yaba</h1>
      </header>

      <!-- Loading status -->
      <p class="loading-status" id="loadingStatus" aria-live="polite">Finding homes&hellip;</p>

      <!-- Skeleton listing cards (reusable structure) -->
      <section class="listing-grid" id="listingGrid">

        <article class="skeleton-card">
          <div class="skeleton-media shimmer"></div>
          <div class="skeleton-body">
            <span class="skeleton-line skeleton-line-title shimmer"></span>
            <span class="skeleton-line skeleton-line-full shimmer"></span>
            <span class="skeleton-line skeleton-line-short shimmer"></span>
          </div>
        </article>

        <article class="skeleton-card">
          <div class="skeleton-media shimmer"></div>
          <div class="skeleton-body">
            <span class="skeleton-line skeleton-line-title shimmer"></span>
            <span class="skeleton-line skeleton-line-full shimmer"></span>
            <span class="skeleton-line skeleton-line-short shimmer"></span>
          </div>
        </article>

        <article class="skeleton-card">
          <div class="skeleton-media shimmer"></div>
          <div class="skeleton-body">
            <span class="skeleton-line skeleton-line-title shimmer"></span>
            <span class="skeleton-line skeleton-line-full shimmer"></span>
            <span class="skeleton-line skeleton-line-short shimmer"></span>
          </div>
        </article>

      </section>
    </main>
  </div>

  <script src="loading.js"></script>
</body>
</html>
