<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RentDirect · Filter homes</title>

  <!-- Fonts: Bricolage Grotesque for display/headings, Inter for body (RentDirect type tokens) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="search.css" />
</head>
<body>
  <div class="app">

    <!-- Dimmed backdrop: the "Find a home" header sits behind the sheet -->
    <div class="backdrop" aria-hidden="true">
      <header class="app-header">
        <div class="brand">
          <span class="brand-mark">R</span>
          <span class="brand-name">RentDirect</span>
        </div>
        <button class="btn-accent" tabindex="-1">List your property</button>
      </header>
    </div>

    <!-- Filter bottom sheet -->
    <main class="sheet" id="filterSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-handle" aria-hidden="true"></div>

      <div class="sheet-scroll">

        <!-- Sheet header -->
        <div class="sheet-header">
          <h1 class="sheet-title" id="sheetTitle">Filter homes</h1>
          <button class="close-btn" id="closeBtn" aria-label="Close filters">
            <svg class="icon icon-close" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M6 6L18 18" stroke="#26221C" stroke-width="2" stroke-linecap="round"/>
              <path d="M18 6L6 18" stroke="#26221C" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <!-- Where -->
        <section class="filter-group">
          <h2 class="filter-label">Where?</h2>

          <label class="search-field" for="areaSearch">
            <svg class="icon icon-search" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="11" cy="11" r="6.5" stroke="#8A8175" stroke-width="1.8"/>
              <path d="M20 20L15.8 15.8" stroke="#8A8175" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <input
              id="areaSearch"
              class="search-input"
              type="text"
              placeholder="Or Search any area, e.g. Maitama"
              autocomplete="off"
            />
          </label>

          <div class="chip-row chip-row-wrap" data-group="area">
            <button class="chip chip-selected" data-value="yaba">Yaba</button>
            <button class="chip" data-value="maitama">Maitama</button>
            <button class="chip" data-value="lekki">Lekki</button>
            <button class="chip" data-value="ikeja">Ikeja</button>
            <button class="chip" data-value="jos">Jos</button>
            <button class="chip" data-value="uyo">Uyo</button>
          </div>
        </section>

        <!-- How much -->
        <section class="filter-group">
          <h2 class="filter-label">How much per year?</h2>

          <div class="chip-row chip-row-wrap" data-group="price">
            <button class="chip" data-value="u300">Under &#8358;300k</button>
            <button class="chip chip-selected" data-value="300-500">&#8358;300k &ndash; &#8358;500k</button>
            <button class="chip" data-value="500-1m">&#8358;500k &ndash; &#8358;1m</button>
            <button class="chip" data-value="above1m">Above &#8358;1m</button>
            <button class="chip" data-value="u200">Under &#8358;200k</button>
          </div>
        </section>

        <!-- Type -->
        <section class="filter-group">
          <h2 class="filter-label">What type of house are you looking for?</h2>

          <div class="chip-row chip-row-wrap" data-group="type">
            <button class="chip" data-value="self-con">Self&ndash;con</button>
            <button class="chip chip-selected" data-value="1bed-duplex">1 bedroom duplex</button>
            <button class="chip" data-value="mini-flat">Mini&ndash;flat</button>
            <button class="chip" data-value="above1m-type">Above &#8358;1m</button>
            <button class="chip" data-value="3bed-flat">3 bedroom flat</button>
          </div>
        </section>

        <!-- Verified toggle -->
        <section class="toggle-card">
          <span class="toggle-icon" aria-hidden="true">
            <svg class="icon icon-shield" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 3.5L18.5 5.8V11C18.5 15.3 15.8 18.3 12 20.2C8.2 18.3 5.5 15.3 5.5 11V5.8L12 3.5Z" stroke="#2D6A4F" stroke-width="1.7" stroke-linejoin="round"/>
              <path d="M9.3 11.2L11.1 13L14.7 9.2" stroke="#2D6A4F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>

          <span class="toggle-copy">
            <span class="toggle-title">Verified homes only</span>
            <span class="toggle-sub">Checked by our team</span>
          </span>

          <button
            class="switch is-on"
            id="verifiedSwitch"
            role="switch"
            aria-checked="true"
            aria-label="Verified homes only"
          >
            <span class="switch-knob"></span>
          </button>
        </section>

      </div>

      <!-- Sheet actions -->
      <div class="sheet-actions">
        <button class="btn-clear" id="clearBtn">Clear all</button>
        <button class="btn-primary" id="showResultsBtn">
          <span class="btn-label">Show <span id="resultCount">14</span> homes</span>
        </button>
      </div>
    </main>

    <!-- Bottom navigation (behind / below the sheet, same as the home screen) -->
    <footer class="app-footer">
      <nav class="bottom-nav" aria-label="Primary">
        <button class="nav-item is-active" data-nav="home">
          <svg class="icon icon-home" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 11.5L12 4.5L20 11.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M6 10V19C6 19.55 6.45 20 7 20H17C17.55 20 18 19.55 18 19V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10 20V15H14V20" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
          <span>Find a home</span>
        </button>

        <button class="nav-item" data-nav="list">
          <svg class="icon icon-plus" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 5V19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M5 12H19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <span>List property</span>
        </button>

        <button class="nav-item" data-nav="how">
          <svg class="icon icon-help" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M9.7 9.3C9.9 8.1 10.9 7.3 12.1 7.4C13.3 7.5 14.2 8.5 14 9.7C13.85 10.7 13 11.1 12.4 11.6C11.9 12 11.6 12.4 11.6 13.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="11.7" cy="15.6" r="0.9" fill="currentColor"/>
          </svg>
          <span>How it works</span>
        </button>
      </nav>
    </footer>
  </div>

  <script src="search.js"></script>
</body>
</html>
